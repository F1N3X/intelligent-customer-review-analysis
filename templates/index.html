<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse de sentiment - McDonald's Reviews</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 60px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #ccc; padding: 32px; }
        h1 { color: #d32f2f; }
        textarea { width: 100%; height: 120px; font-size: 1.1em; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #d32f2f; color: #fff; border: none; padding: 12px 24px; border-radius: 4px; font-size: 1.1em; cursor: pointer; margin-top: 12px; }
        .result { margin-top: 24px; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analyse de sentiment</h1>
            <p>Écrivez votre avis sur McDonald's ci-dessous en <span style="font-size: 1.2em; color: red;">anglais</span> pour analyser le sentiment.</p>
        <form id="sentiment-form">
            <label for="review">Votre avis :</label><br>
            <textarea id="review" name="review" required></textarea><br>
            <button type="submit">Analyser</button>
        </form>
        <div class="result" id="result"></div>
    </div>
    <script>
        document.getElementById('sentiment-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = document.getElementById('review').value;
            document.getElementById('result').textContent = 'Analyse en cours...';
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const data = await response.json();
            if (data.sentiment) {
                document.getElementById('result').textContent = 'Sentiment : ' + data.sentiment;
            } else {
                document.getElementById('result').textContent = 'Erreur : ' + (data.error || 'Analyse impossible.');
            }
        });
    </script>
</body>
</html>
